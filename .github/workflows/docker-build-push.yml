name: Build and Push Docker Image

on:
  push:
    branches:
      - "**"
  pull_request:
  schedule:
    # Runs every day at 00:00 UTC
    - cron: "0 0 * * *"

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare build
    runs-on: ubuntu-24.04
    outputs:
      handbrake_version: ${{ steps.vars.outputs.handbrake_version }}
      tags: ${{ steps.image-tags.outputs.tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine HandBrake version
        id: vars
        run: |
          version=$(git ls-remote --tags --refs https://github.com/HandBrake/HandBrake.git \
            | sed 's#^.*/##' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n 1)
          test -n "$version"
          echo "handbrake_version=$version" >> "$GITHUB_OUTPUT"

      - name: Determine image tags
        id: image-tags
        env:
          IMAGE: ${{ vars.DOCKERHUB_REPO }}
          VERSION: ${{ steps.vars.outputs.handbrake_version }}
        run: |
          tags=""

          # Scheduled builds always publish nightly. Commit builds, and the
          # first scheduled build of a new HandBrake version, are promoted.
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            tags="${IMAGE}:nightly"
          fi

          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/master" ]] \
            || ([[ "${{ github.event_name }}" == "schedule" ]] \
              && ! docker buildx imagetools inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1); then
            if [[ -n "$tags" ]]; then
              tags+=$'\n'
            fi
            tags+="${IMAGE}:${VERSION}"$'\n'"${IMAGE}:latest"
          fi

          {
            echo 'tags<<EOF'
            echo "$tags"
            echo EOF
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }} image
    needs: prepare
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tag
        id: image
        run: |
          echo "tag=${{ vars.DOCKERHUB_REPO }}:${{ github.sha }}-${{ github.run_number }}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          build-args: |
            HANDBRAKE_VERSION=${{ needs.prepare.outputs.handbrake_version }}
          tags: ${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Test image
        run: |
          docker run --rm "${{ steps.image.outputs.tag }}" --version

      - name: Push image
        if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
        run: |
          docker push "${{ steps.image.outputs.tag }}"

  manifest:
    name: Publish multi-architecture image
    needs: [prepare, build]
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push multi-architecture manifests
        env:
          IMAGE: ${{ vars.DOCKERHUB_REPO }}
          BUILD_ID: ${{ github.sha }}-${{ github.run_number }}
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          sources=(
            "${IMAGE}:${BUILD_ID}-amd64"
            "${IMAGE}:${BUILD_ID}-arm64"
          )

          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            docker buildx imagetools create \
              -t "$tag" \
              "${sources[@]}"
          done <<< "$TAGS"
