name: Build and Push Docker Image

on:
  push:
    branches:
      - "**"
  schedule:
    # Runs every day at 00:00 UTC
    - cron: "0 0 * * *"

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up QEMU for multi-architecture support
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine HandBrake version
        id: vars
        run: |
          version=$(git ls-remote --tags --refs https://github.com/HandBrake/HandBrake.git \
            | sed 's#^.*/##' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n 1)
          test -n "$version"
          echo "handbrake_version=$version" >> "$GITHUB_OUTPUT"

      - name: Determine image tags
        id: image-tags
        env:
          IMAGE: ${{ vars.DOCKERHUB_REPO }}
          VERSION: ${{ steps.vars.outputs.handbrake_version }}
        run: |
          tags=""

          # Scheduled builds always publish nightly. Commit builds, and the
          # first scheduled build of a new HandBrake version, are promoted.
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            tags="${IMAGE}:nightly"
          fi

          if [[ "${{ github.event_name }}" != "schedule" ]] \
            || ! docker buildx imagetools inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1; then
            if [[ -n "$tags" ]]; then
              tags+=$'\n'
            fi
            tags+="${IMAGE}:${VERSION}"$'\n'"${IMAGE}:latest"
          fi

          {
            echo 'tags<<EOF'
            echo "$tags"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      # Build and push multi-arch image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          build-args: |
            HANDBRAKE_VERSION=${{ steps.vars.outputs.handbrake_version }}
          tags: ${{ steps.image-tags.outputs.tags }}
          platforms: linux/amd64,linux/arm64
